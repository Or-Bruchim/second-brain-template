name: Lint wiki

# "on" is quoted defensively against YAML boolean-key coercion. The real parse
# break was the unindented `[skip ci]"` below terminating the run: literal block,
# which left GitHub unable to parse this file (workflow showed up named by its
# path, dispatch disabled, phantom 0s "workflow file issue" on every push).
"on":
  schedule:
    - cron: '0 9 * * 1'  # Mondays at 09:00 UTC
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run wiki lint
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/lint-wiki.mjs

      - name: Commit lint report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/lint content/log.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No lint changes to commit."
            exit 0
          fi
          git commit -m "lint: weekly wiki health check

          [skip ci]"
          git push
