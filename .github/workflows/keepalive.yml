name: Supabase Keep-Alive

# Prevents the free-tier Supabase project from auto-pausing (which happens
# after ~7 days of no DB activity and takes the project off DNS entirely).
# Runs every 3 days — comfortably inside that window even if a run is skipped.
"on":
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Template repos and forks have no Supabase project, so the cron would
      # fail every 3 days. Skip instead of failing when the secrets are absent.
      - name: Check for Supabase secrets
        id: key
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "SUPABASE_URL/SUPABASE_SERVICE_KEY not set - skipping keep-alive."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping Supabase
        if: steps.key.outputs.present == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/keepalive.mjs
